<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majalah Sekolah</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .header-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #000;
        }

        .header-subtitle {
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 30px;
            color: #444;
            font-weight: bold;
        }

        .btn-main {
            background-color: #1a1845;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 25px;
            transition: 0.3s;
        }

        /* --- BLOK 1: ARTIKEL (ABU-ABU KEBIRUAN) --- */
        .section-articles {
            background-color: #cbd5e1;
            padding: 50px 20px;
            text-align: center;
            width: 100%;
        }

        .articles-grid {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .articles-grid { grid-template-columns: 1fr; }
        }

        .article-card {
            background-color: #38bdf8;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            gap: 15px;
            text-align: left;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .article-img {
            width: 110px;
            height: 110px;
            background-color: #ddd;
            border-radius: 10px;
            object-fit: cover;
        }

        .article-content {
            flex: 1;
            color: #000;
        }

        .tag-category {
            font-size: 11px;
            font-weight: bold;
            color: #1e3a8a;
            text-transform: uppercase;
        }

        .article-title {
            font-size: 18px;
            font-weight: bold;
            margin: 3px 0;
        }

        .article-desc {
            font-size: 11px;
            line-height: 1.4;
            color: #1f2937;
        }

        /* --- BLOK 2: KATALOG MAJALAH (HIJAU) --- */
        .section-catalog {
            background-color: #4ade80;
            padding: 50px 20px;
            text-align: center;
            width: 100%;
        }

        .carousel-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .magazine-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .magazine-card { width: 150px; text-align: center; }

        .magazine-cover {
            width: 100%; height: 200px; background-color: #e2e8f0;
            border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            margin-bottom: 10px; object-fit: cover;
        }

        /* --- BLOK 3: UNGGAH KARYA (KUNING) --- */
        .section-upload {
            background-color: #facc15;
            padding: 50px 20px;
            text-align: center;
            width: 100%;
        }

        .upload-container {
            max-width: 800px; margin: 0 auto;
            display: flex; gap: 40px; justify-content: center;
        }

        .upload-box {
            background-color: #bfdbfe; border-radius: 15px; padding: 25px;
            flex: 1; max-width: 350px; text-align: center;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        }

        .upload-box-img { width: 80px; height: 80px; background-color: #94a3b8; border-radius: 8px; margin-bottom: 15px;}
        .btn-upload { background-color: #1a1845; color: white; border: none; padding: 10px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; width: 100%; text-decoration: none;}
    </style>
</head>
<body>

    <!-- SECTION 1: ARTIKEL OTOMATIS -->
    <section class="section-articles">
        <h1 class="header-title">Majalah Sekolah</h1>
        <p class="header-subtitle">SEMUA TULISAN PELAJAR DAN MAJALAH SEKOLAH KUMPUL DI SINI</p>

        <!-- Tempat kartu artikel dari Google Sheets akan muncul otomatis -->
        <div class="articles-grid" id="artikel-container">
            <p style="grid-column: 1/-1; color: #555;">Memuat tulisan terbaru...</p>
        </div>

        <button class="btn-main">Cari Tulisan Lainnya</button>
    </section>

    <!-- SECTION 2: KATALOG MAJALAH -->
    <section class="section-catalog">
        <h1 class="header-title">Majalah Sekolah</h1>
        <p class="header-subtitle">SEMUA TULISAN PELAJAR DAN MAJALAH SEKOLAH KUMPUL DI SINI</p>
        <div class="carousel-container">
            <div class="magazine-grid">
                <div class="magazine-card">
                    <div class="magazine-cover" style="background-color: #ef4444; color:white; display:flex; align-items:center; justify-content:center; font-weight:bold;">LENSA 29</div>
                </div>
                <div class="magazine-card">
                    <div class="magazine-cover" style="background-color: #3b82f6; color:white; display:flex; align-items:center; justify-content:center; font-weight:bold;">RAGAM</div>
                </div>
            </div>
        </div>
    </section>

    <!-- SECTION 3: UNGGAH -->
    <section class="section-upload">
        <h1 class="header-title">Unggah Karyamu</h1>
        <div class="upload-container">
            <div class="upload-box">
                <div class="upload-box-img"></div>
                <h3>Kirim Tulisan & Foto</h3>
                <a href="PASTE_LINK_GOOGLE_FORM_ANDA" target="_blank" class="btn-upload">Unggah Tulisanmu</a>
            </div>
        </div>
    </section>

    <!-- KODE PINTAR JAVASCRIPT UNTUK AKSI OTOMATIS -->
    <script>
        // MASUKKAN LINK CSV GOOGLE SHEETS ANDA DI BAWAH INI
        const URL_SHEETS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTldwmswoIBAsg99buTq2-9FnVdF6PPwPITegmNTjOi3k9Max4DZVq57vecMKlO5dF-jcOC1xHXnt4c/pub?output=csv";

        function konversiLinkDrive(url) {
            if (!url) return "https://placeholder.com";
            // Mengubah link upload Google Drive menjadi link gambar langsung agar bisa tampil di web
            const idCocok = url.match(/id=([^&]+)/) || url.match(/\/d\/([^/]+)/);
            if (idCocok) {
                return `https://googleusercontent.com{idCocok[1]}`;
            }
            return url;
        }

        async function muatArtikelOtomatis() {
            try {
                const respon = await fetch(URL_SHEETS);
                const dataTeks = await respon.text();
                
                // Memisahkan data per baris kalimat
                const barisData = dataTeks.split("\n").slice(1); 
                const kontainer = document.getElementById("artikel-container");
                kontainer.innerHTML = ""; // Bersihkan teks memuat

                barisData.forEach(baris => {
                    if (baris.trim() === "") return;
                    
                    // Memisahkan kolom data (menggunakan aturan CSV dasar)
                    const kolom = baris.split(/,(?=(?:(?:[^"]*"){2})*[^"]*\$)/);
                    
                    // SESUAIKAN NOMOR URUTAN KOLOM DI GOOGLE SHEETS ANDA (Dimulai dari angka 0)
                    // Contoh asumsi urutan kolom: 0=Timestamp, 1=Email, 2=Kategori, 3=Judul, 4=Isi Cerita, 5=Link Foto
                    const kategori = kolom[2]?.replace(/"/g, "") || "Berita";
                    const judul = kolom[3]?.replace(/"/g, "") || "Judul Tulisan";
                    const isi = kolom[4]?.replace(/"/g, "") || "Memuat isi tulisan...";
                    const linkFoto = konversiLinkDrive(kolom[5]?.replace(/"/g, "").trim());

                    // Membuat susunan HTML Kartu Artikel secara dinamis
                    const kodeKartuHtml = `
                        <div class="article-card">
                            <img src="${linkFoto}" class="article-img" alt="Foto Artikel" onerror="this.src='https://placeholder.com'">
                            <div class="article-content">
                                <span class="tag-category">${kategori}</span>
                                <h2 class="article-title">${judul}</h2>
                                <p class="article-desc">${isi.substring(0, 100)}...</p>
                            </div>
                        </div>
                    `;
                    kontainer.innerHTML += kodeKartuHtml;
                });
            } catch (error) {
                console.error("Gagal memuat data:", error);
                document.getElementById("artikel-container").innerHTML = "<p>Gagal memuat artikel terbaru otomatis.</p>";
            }
        }

        // Jalankan fungsi otomatis saat halaman web dibuka
        window.onload = muatArtikelOtomatis;
    </script>
</body>
</html>
